services:
  redis:
    image: redis:7-alpine
    container_name: cypher-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cypher-network
    command: redis-server --requirepass cypher --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cypher", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  cypher-network:
    driver: bridge 